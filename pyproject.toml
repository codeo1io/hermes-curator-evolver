[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hermes-curator-evolver"
version = "0.10.0"
description = "Plug-and-play evidence-driven skill evolution for Hermes Agent with one-command bootstrap, provenance-safe autorun, historical session backfill, optional semantic/rerank ordering, and guarded apply."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pingchesu" }]
keywords = [
  "hermes-agent",
  "hermes-plugin",
  "agents",
  "ai-agents",
  "ai-skills",
  "skills",
  "curator",
  "skill-evolution",
  "skill-governance",
  "evidence-driven",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/pingchesu/hermes-curator-evolver"
Repository = "https://github.com/pingchesu/hermes-curator-evolver"
Issues = "https://github.com/pingchesu/hermes-curator-evolver/issues"
Documentation = "https://github.com/pingchesu/hermes-curator-evolver/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8"]
semantic = ["sentence-transformers>=3"]

[project.scripts]
hermes-curator-evolver = "hermes_curator_evolver.__main__:main"

[project.entry-points."hermes_agent.plugins"]
curator-evolver = "hermes_curator_evolver"

[tool.hatch.build.targets.wheel]
packages = ["hermes_curator_evolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
# Pinned lint surface (roadmap U80, cycle 9): freeze the rule set to what
# ruff shipped when this repository's baselines were recorded — pyflakes
# (F) plus the default pycodestyle subset (E4/E7/E9). Pinning `select`
# explicitly keeps the gate stable across future ruff releases even though
# the effective default set here matches it today. Recorded baselines for
# the count ceiling: 63 findings in hermes_curator_evolver+tests plus 16 in
# scripts (= 79) at ruff 0.16.7; 16 whole-tree at ruff 0.15.10 (the only
# arm on the maintenance host). New code must add zero findings; clearing
# the pre-existing backlog is U56's scope, which is why CI enforces the
# ceiling rather than zero.
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
