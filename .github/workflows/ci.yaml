name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full-matrix run (3.11 + 3.12). PRs run the 3.12 fast lane only.
    - cron: '13 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PR fast lane: 3.12 only. Full matrix (3.11 + 3.12) on push to main
        # and on the nightly schedule.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11", "3.12"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No actions/setup-python `cache: pip` on purpose: measured on this
      # repository's former self-hosted runner, the GitHub Actions cache
      # round-trip ("Post Set up Python") cost 101-238s per job — more than
      # the tests themselves. CI moved to GitHub-hosted runners when the
      # repo went public (PR #7, 2026-09-22); a fresh-runner install is
      # still faster than the measured cache round-trip, so no cache stands.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q

  lint:
    name: Lint (ruff count ceiling)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Roadmap U80 (cycle 9): the lint gate pins ruff exactly — the rule
      # set is frozen in pyproject [tool.ruff.lint] — and enforces a COUNT
      # CEILING on the recorded baseline (63 findings in
      # hermes_curator_evolver+tests + 16 in scripts = 79 at ruff 0.16.7),
      # not zero: clearing the pre-existing backlog is U56's scope. New
      # code must add zero findings; exceeding the ceiling fails the build.
      - name: Install pinned ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.7

      - name: Ruff findings vs baseline ceiling
        run: |
          set +e
          ruff check hermes_curator_evolver tests scripts --output-format concise > ruff-report.txt
          status=$?
          set -e
          if [ "$status" -ge 2 ]; then
            cat ruff-report.txt
            echo "ruff itself failed (exit $status)"
            exit 1
          fi
          # Count FINDING LINES only (cycle-9 review F1): `grep -c .` also
          # counted ruff's "Found N errors." and "[*] N fixable..." summary
          # lines (+2), which would have made the gate deterministically red
          # at the recorded 79-finding baseline. Concise finding lines are
          # `path:line:col: CODE message`.
          count=$(grep -cE ':[0-9]+:[0-9]+:' ruff-report.txt || true)
          echo "ruff finding lines: ${count} (baseline ceiling: 79)"
          cat ruff-report.txt
          if [ "$count" -gt 79 ]; then
            echo "FAIL: findings exceeded the recorded baseline ceiling (79) — report above"
            exit 1
          fi
