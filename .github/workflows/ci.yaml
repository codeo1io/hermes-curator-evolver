name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full-matrix run (3.11 + 3.12). PRs run the 3.12 fast lane only.
    - cron: '13 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PR fast lane: 3.12 only. Full matrix (3.11 + 3.12) on push to main
        # and on the nightly schedule.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11", "3.12"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # No actions/setup-python `cache: pip` on purpose: this job runs on a
      # self-hosted runner whose ~/.cache/pip persists between runs. Measured,
      # the GitHub Actions cache round-trip ("Post Set up Python") cost
      # 101-238s per job — more than the tests themselves — while the local
      # pip cache makes the install step fast anyway.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q
